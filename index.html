<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Việt Phục AI Stylist – Tư vấn trang phục truyền thống Việt Nam</title>
<meta name="description" content="Ứng dụng AI tư vấn phối đồ trang phục truyền thống Việt Nam – Áo tứ thân, Áo ngũ thân, Nhật Bình và hơn thế nữa."/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
/* ════════════════════════════════════════════════════
   DESIGN TOKENS
════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#07080b;--bg1:#0d1018;--bg2:#131821;--bg3:#192030;--bg4:#1e2738;--bg5:#232d42;
  --bdr:rgba(255,255,255,0.06);--bdg:rgba(180,140,60,0.28);
  --son:#c0392b;--sonL:#e74c3c;--sonD:#8b2318;--sonGlow:rgba(192,57,43,0.2);
  --gold:#c9a84c;--goldL:#f0c96e;--goldD:rgba(201,168,76,0.1);
  --blue:#2c5f8a;--blueL:#4a8fbf;
  --green:#27ae60;--greenL:#52be80;
  --t1:#ede9df;--t2:#9a917a;--t3:#504840;
  --r1:6px;--r2:12px;--r3:20px;
  --shadow:0 4px 24px rgba(0,0,0,0.4)
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg0);color:var(--t1);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.35);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}

/* ════════════════════════════════════════════════════
   LAYOUT
════════════════════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.grid{flex:1;display:grid;grid-template-columns:268px 1fr 332px;overflow:hidden}
.col-l,.col-r{display:flex;flex-direction:column;overflow:hidden}
.col-l{border-right:1px solid var(--bdr);background:linear-gradient(180deg,var(--bg1),var(--bg0))}
.col-r{border-left:1px solid var(--bdr);background:var(--bg1)}
.col-c{display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#131d2e 0%,var(--bg0) 65%)}

/* ════════════════════════════════════════════════════
   HEADER
════════════════════════════════════════════════════ */
.hdr{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:11px 22px;
  background:linear-gradient(90deg,#08090e,#0f1520);
  border-bottom:1px solid var(--bdr);
  position:relative;z-index:10
}
.hdr::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,var(--gold) 30%,var(--son) 50%,var(--gold) 70%,transparent 100%);
  opacity:0.4
}
.logo{
  font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;letter-spacing:0.08em;
  background:linear-gradient(135deg,var(--goldL) 0%,var(--sonL) 55%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.logo-s{font-size:0.56rem;color:var(--t3);letter-spacing:0.25em;text-transform:uppercase;margin-top:1px}
.hdr-r{display:flex;align-items:center;gap:12px}
.badge{font-size:0.57rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--bdg);color:var(--gold);background:var(--goldD)}
.dot-wrap{display:flex;align-items:center;gap:5px;font-size:0.61rem;color:var(--t2)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-mock{background:#f39c12;box-shadow:0 0 7px #f39c12;animation:pulse 2s infinite}
.dot-live{background:var(--green);box-shadow:0 0 7px var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.55}}
.hdr-count{font-size:0.6rem;color:var(--t3);border-left:1px solid var(--bdr);padding-left:12px}
.hdr-count-n{font-weight:700;color:var(--gold)}

/* ════════════════════════════════════════════════════
   SECTION HEADER
════════════════════════════════════════════════════ */
.sec-hdr{flex-shrink:0;padding:13px 16px 9px;border-bottom:1px solid var(--bdr)}
.sec-title{font-size:0.56rem;font-weight:700;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.sec-body{flex:1;overflow-y:auto;padding:8px 10px}

/* ════════════════════════════════════════════════════
   SEARCH
════════════════════════════════════════════════════ */
.search-wrap{position:relative;display:flex;align-items:center}
.search-ico{position:absolute;left:9px;color:var(--t3);flex-shrink:0}
.search-inp{
  width:100%;padding:6px 30px 6px 28px;
  background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r1);
  color:var(--t1);font-family:'Inter',sans-serif;font-size:0.7rem;
  outline:none;transition:border-color 0.18s
}
.search-inp:focus{border-color:rgba(201,168,76,0.45)}
.search-inp::placeholder{color:var(--t3)}
.search-clr{position:absolute;right:7px;background:none;border:none;color:var(--t3);cursor:pointer;display:flex;align-items:center}
.search-clr:hover{color:var(--t1)}

/* ════════════════════════════════════════════════════
   CATEGORY LIST
════════════════════════════════════════════════════ */
.cat-list{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.cat-btn{
  display:flex;align-items:center;gap:9px;padding:8px 11px;
  border-radius:var(--r1);border:1px solid transparent;
  background:transparent;color:var(--t2);font-size:0.74rem;
  font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.16s;text-align:left;width:100%
}
.cat-btn:hover{background:var(--bg4);color:var(--t1);border-color:var(--bdr)}
.cat-btn.active{
  background:linear-gradient(135deg,rgba(192,57,43,0.18),rgba(201,168,76,0.06));
  border-color:rgba(192,57,43,0.4);color:var(--t1)
}
.cat-ico{font-size:0.95rem;width:18px;text-align:center}
.cat-n{margin-left:auto;font-size:0.6rem;font-weight:700;padding:2px 6px;border-radius:99px;background:var(--bg5);color:var(--t3)}
.cat-btn.active .cat-n{background:var(--son);color:#fff}

/* ════════════════════════════════════════════════════
   FILTER ROW
════════════════════════════════════════════════════ */
.filter-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.fc{padding:3px 9px;border-radius:99px;font-size:0.6rem;font-weight:600;border:1px solid var(--bdr);background:transparent;color:var(--t3);cursor:pointer;transition:all 0.14s;font-family:'Inter',sans-serif}
.fc:hover{border-color:rgba(255,255,255,0.16);color:var(--t2)}
.fc-all{background:var(--bg4);border-color:rgba(255,255,255,0.14);color:var(--t1)}
.fc-bac{background:rgba(44,95,138,0.2);border-color:rgba(74,143,191,0.38);color:var(--blueL)}
.fc-trung{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.32);color:var(--goldL)}
.fc-nam{background:rgba(39,174,96,0.1);border-color:rgba(39,174,96,0.32);color:var(--greenL)}

/* ════════════════════════════════════════════════════
   ITEM GRID & CARDS
════════════════════════════════════════════════════ */
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.item-card{
  border-radius:var(--r1);border:1px solid var(--bdr);background:var(--bg2);
  cursor:pointer;transition:all 0.18s;overflow:hidden;position:relative
}
.item-card:hover:not(.incomp){border-color:rgba(255,255,255,0.12);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.3)}
.item-card.sel{
  border-color:var(--son);
  background:linear-gradient(135deg,rgba(192,57,43,0.14),rgba(201,168,76,0.05));
  box-shadow:0 0 18px var(--sonGlow)
}
.item-card.incomp{opacity:0.3;cursor:not-allowed}
.item-card.incomp:hover{transform:none;box-shadow:none}
.item-thumb{
  width:100%;aspect-ratio:1;
  background:linear-gradient(135deg,#161c2c,#1d2440);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden
}
.item-emoji{font-size:2.4rem;position:relative;z-index:1;transition:transform 0.2s}
.item-card:hover .item-emoji{transform:scale(1.1)}
.item-thumb-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(192,57,43,0.18),transparent 70%)}
.item-info{padding:7px 9px 9px}
.item-name{font-size:0.68rem;font-weight:600;color:var(--t1);line-height:1.3;margin-bottom:4px}
.item-event{font-size:0.56rem;color:var(--t3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-rgn{font-size:0.57rem;display:inline-block;padding:2px 7px;border-radius:99px;font-weight:500}
.rgn-b{background:rgba(44,95,138,0.25);color:var(--blueL);border:1px solid rgba(74,143,191,0.25)}
.rgn-t{background:rgba(201,168,76,0.1);color:var(--goldL);border:1px solid rgba(201,168,76,0.25)}
.rgn-n{background:rgba(39,174,96,0.1);color:var(--greenL);border:1px solid rgba(39,174,96,0.25)}
.rgn-a{background:rgba(255,255,255,0.06);color:var(--t2);border:1px solid var(--bdr)}
.sel-badge{position:absolute;top:5px;right:5px;z-index:2;width:18px;height:18px;border-radius:50%;background:var(--son);display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:700;color:#fff;box-shadow:0 0 8px var(--sonGlow)}
.incomp-badge{position:absolute;top:5px;right:5px;z-index:2;font-size:0.6rem;padding:2px 5px;border-radius:3px;background:rgba(255,50,50,0.6);color:#fff}

/* ════════════════════════════════════════════════════
   AVATAR AREA (Center Column)
════════════════════════════════════════════════════ */
.avatar-area{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;padding:24px 20px 16px;gap:16px
}
.grid-bg{
  position:absolute;inset:0;opacity:0.03;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(201,168,76,0.6) 40px,rgba(201,168,76,0.6) 41px),
    repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(201,168,76,0.6) 40px,rgba(201,168,76,0.6) 41px)
}
.avatar-frame{
  width:min(260px,50%);aspect-ratio:0.55/1;
  border-radius:50% 50% 44% 44%/62% 62% 38% 38%;
  background:linear-gradient(180deg,#172030,#11192a);
  border:1px solid rgba(201,168,76,0.15);
  position:relative;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 60px rgba(0,0,0,0.5),inset 0 1px 0 rgba(201,168,76,0.1)
}
.avatar-glow{
  position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
  width:60%;height:30px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(201,168,76,0.22),transparent 70%)
}
.avatar-layers{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.avatar-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px}
.avatar-icon-empty{font-size:4.5rem;opacity:0.12;filter:drop-shadow(0 0 20px rgba(201,168,76,0.2))}
.avatar-hint{font-size:0.68rem;color:var(--t3);text-align:center;line-height:1.5}
.avatar-emoji-stack{display:flex;align-items:center;justify-content:center;position:relative;width:100%;height:100%}
.avatar-emoji-layer{position:absolute;transition:all 0.3s;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5))}
.score-badge{
  position:absolute;top:10px;right:-38px;
  background:rgba(8,10,17,0.92);backdrop-filter:blur(10px);
  border:1px solid var(--bdg);border-radius:var(--r1);padding:5px 9px;
  display:flex;align-items:baseline;gap:2px
}
.score-val{font-size:1.4rem;font-weight:700;font-family:'Playfair Display',serif}
.score-max{font-size:0.6rem;color:var(--t3)}
.score-g{color:var(--greenL)}.score-o{color:var(--goldL)}.score-r{color:var(--sonL)}
.outfit-tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:100%}
.otag{
  display:flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;
  border-radius:99px;background:rgba(10,13,22,0.9);backdrop-filter:blur(8px);
  border:1px solid var(--bdg);font-size:0.67rem;font-weight:500;color:var(--goldL);
  cursor:pointer;animation:tagIn 0.26s ease;transition:all 0.14s
}
.otag:hover{border-color:var(--gold);background:rgba(201,168,76,0.12)}
.otag button{background:none;border:none;color:var(--t3);cursor:pointer;line-height:1;padding:0;display:flex;align-items:center;transition:color 0.14s}
.otag button:hover{color:var(--sonL)}
@keyframes tagIn{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
.warn-panel{
  width:100%;max-width:500px;
  background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.25);
  border-radius:var(--r1);padding:9px 13px;animation:fadeIn 0.25s ease
}
.warn-title{font-size:0.58rem;font-weight:700;color:var(--sonL);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.warn-item{font-size:0.66rem;color:#e0a0a0;line-height:1.55;padding:1px 0}

/* ════════════════════════════════════════════════════
   CTRL BAR
════════════════════════════════════════════════════ */
.ctrl-bar{
  flex-shrink:0;padding:10px 16px;border-top:1px solid var(--bdr);
  display:flex;gap:8px;align-items:center;background:rgba(10,13,22,0.6)
}
.cbtn{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:var(--r1);border:none;
  font-family:'Inter',sans-serif;font-size:0.68rem;font-weight:600;
  letter-spacing:0.04em;cursor:pointer;transition:all 0.16s;text-transform:uppercase
}
.cbtn:disabled{opacity:0.3;cursor:not-allowed}
.cbtn-p{background:var(--bg3);color:var(--t2);border:1px solid var(--bdr)}
.cbtn-p:hover:not(:disabled){background:var(--bg4);color:var(--sonL);border-color:rgba(192,57,43,0.4)}
.score-box-inline{flex:1;padding-left:10px;border-left:1px solid var(--bdr)}
.score-lbl{font-size:0.55rem;color:var(--t3);text-transform:uppercase;letter-spacing:0.1em}
.score-val-sm{font-size:0.72rem;font-weight:700;margin-top:1px}

/* ════════════════════════════════════════════════════
   AI CHATBOT (Right Column)
════════════════════════════════════════════════════ */
.ai-hdr{
  flex-shrink:0;padding:13px 16px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:10px
}
.ai-av{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--son),var(--gold));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 16px var(--sonGlow)
}
.ai-info{flex:1;min-width:0}
.ai-name{font-size:0.8rem;font-weight:600}
.ai-model{font-size:0.58rem;color:var(--t3);margin-top:2px}
.ai-live-badge{display:flex;align-items:center;gap:4px;color:var(--greenL)}
.link-btn{background:none;border:none;color:var(--gold);font-size:0.58rem;cursor:pointer;padding:0;text-decoration:underline}
.link-btn:hover{color:var(--goldL)}
.key-toggle-btn{background:var(--bg3);border:1px solid var(--bdr);color:var(--t2);width:30px;height:30px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.16s;flex-shrink:0}
.key-toggle-btn:hover{background:var(--bg4);color:var(--goldL);border-color:var(--bdg)}

.key-bar{
  flex-shrink:0;padding:9px 14px;
  background:rgba(201,168,76,0.04);border-bottom:1px solid var(--bdg);
  display:flex;gap:6px;align-items:center
}
.key-inp{
  flex:1;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r1);
  color:var(--t1);font-family:'Inter',sans-serif;font-size:0.67rem;padding:6px 10px;
  outline:none;transition:border-color 0.18s
}
.key-inp:focus{border-color:var(--gold)}
.key-inp::placeholder{color:var(--t3)}
.key-btn{
  padding:6px 11px;border-radius:var(--r1);background:var(--gold);
  color:#1a1200;border:none;font-size:0.63rem;font-weight:700;cursor:pointer;
  white-space:nowrap;font-family:'Inter',sans-serif;transition:all 0.16s
}
.key-btn:hover:not(:disabled){opacity:0.85;transform:translateY(-1px)}
.key-btn:disabled{opacity:0.4;cursor:not-allowed}
.key-btn-off{background:var(--bg4);color:var(--t2);border:1px solid var(--bdr)}

.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;animation:msgIn 0.25s ease}
.msg.usr{flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mav{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;margin-top:2px
}
.mav-ai{background:linear-gradient(135deg,var(--son),var(--gold))}
.mav-u{background:var(--bg4);border:1px solid var(--bdr)}
.mbody{max-width:86%;padding:9px 12px;border-radius:var(--r1);font-size:0.74rem;line-height:1.62;color:var(--t1)}
.mbody.ai{background:var(--bg3);border:1px solid var(--bdr);border-top-left-radius:2px}
.mbody.usr{
  background:linear-gradient(135deg,rgba(192,57,43,0.28),rgba(192,57,43,0.15));
  border:1px solid rgba(192,57,43,0.35);border-top-right-radius:2px;text-align:right
}
.mout{margin-top:8px;padding:8px;border-radius:var(--r1);background:rgba(201,168,76,0.07);border:1px solid rgba(201,168,76,0.18)}
.mout-t{font-size:0.58rem;color:var(--goldL);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:5px;font-weight:700;display:flex;align-items:center;gap:5px}
.mout-pills{display:flex;flex-wrap:wrap;gap:4px}
.mpill{
  font-size:0.6rem;padding:3px 8px;border-radius:99px;
  background:var(--bg2);border:1px solid var(--bdr);color:var(--t2);
  cursor:pointer;transition:all 0.14s
}
.mpill:hover{border-color:var(--bdg);color:var(--goldL);background:var(--bg3)}
.mwarn{margin-top:8px;padding:8px;border-radius:var(--r1);background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.25)}
.mwarn-t{font-size:0.58rem;color:var(--sonL);font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.mwarn-b{font-size:0.66rem;color:#d9a0a0;line-height:1.55}
.mcult{margin-top:8px;padding:8px;border-radius:var(--r1);background:rgba(44,95,138,0.08);border:1px solid rgba(74,143,191,0.2)}
.mcult-t{font-size:0.58rem;color:var(--blueL);font-weight:700;margin-bottom:4px;letter-spacing:0.08em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.mcult-b{font-size:0.67rem;color:#a8c8e0;line-height:1.6}
.typing{display:flex;align-items:center;gap:4px;padding:3px 0}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:bounce 1.2s infinite}
.tdot:nth-child(2){animation-delay:0.2s}
.tdot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0.5);opacity:0.3}40%{transform:scale(1);opacity:1}}
.suggs{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.sugg{
  padding:7px 11px;border-radius:var(--r1);
  background:var(--bg3);border:1px solid var(--bdr);color:var(--t2);
  font-size:0.68rem;cursor:pointer;transition:all 0.14s;text-align:left;
  font-family:'Inter',sans-serif;display:flex;align-items:center;gap:8px
}
.sugg:hover{background:var(--bg4);color:var(--t1);border-color:rgba(255,255,255,0.12);transform:translateX(3px)}
.inp-bar{
  flex-shrink:0;padding:10px 13px;border-top:1px solid var(--bdr);
  display:flex;gap:7px;align-items:flex-end;background:rgba(10,13,22,0.4)
}
.inp-ta{
  flex:1;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r1);
  color:var(--t1);font-family:'Inter',sans-serif;font-size:0.74rem;
  padding:9px 12px;outline:none;resize:none;
  min-height:38px;max-height:110px;transition:border-color 0.18s;line-height:1.5
}
.inp-ta:focus{border-color:rgba(192,57,43,0.5)}
.inp-ta::placeholder{color:var(--t3)}
.inp-btn{
  width:38px;height:38px;border-radius:var(--r1);
  background:linear-gradient(135deg,var(--son),var(--sonD));
  border:none;color:#fff;cursor:pointer;transition:all 0.18s;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 14px var(--sonGlow)
}
.inp-btn:hover:not(:disabled){transform:scale(1.08);box-shadow:0 5px 20px var(--sonGlow)}
.inp-btn:disabled{opacity:0.35;cursor:not-allowed}

/* ════════════════════════════════════════════════════
   ITEM DRAWER
════════════════════════════════════════════════════ */
.drawer{
  position:fixed;bottom:0;left:268px;right:332px;
  background:var(--bg2);border:1px solid var(--bdg);border-bottom:none;
  border-radius:var(--r2) var(--r2) 0 0;
  padding:18px 22px 22px;
  transform:translateY(100%);
  transition:transform 0.3s cubic-bezier(0.34,1.4,0.64,1);
  z-index:100;max-height:55vh;overflow-y:auto
}
.drawer.open{transform:translateY(0)}
.drawer::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--son),var(--gold),transparent);opacity:0.5}
.dr-close{position:absolute;top:14px;right:16px;background:var(--bg4);border:1px solid var(--bdr);color:var(--t2);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.14s}
.dr-close:hover{background:var(--bg5);color:var(--t1);border-color:rgba(255,255,255,0.2)}
.dr-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dr-emoji{font-size:2.2rem}
.dr-name{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700}
.dr-alias{font-size:0.66rem;color:var(--t3);margin-top:2px}
.dr-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--bdr)}
.dr-st{font-size:0.57rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.dr-txt{font-size:0.7rem;color:var(--t2);line-height:1.62}
.dr-pills{display:flex;flex-wrap:wrap;gap:4px}
.dr-pill{font-size:0.61rem;padding:2px 8px;border-radius:99px;background:var(--bg4);border:1px solid var(--bdr);color:var(--t2)}
.dr-pill-r{background:rgba(44,95,138,0.2);border-color:rgba(74,143,191,0.3);color:var(--blueL)}
.dr-pill-e{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.28);color:var(--goldL)}
.dr-pill-g{background:rgba(39,174,96,0.1);border-color:rgba(39,174,96,0.28);color:var(--greenL);cursor:pointer}
.dr-pill-g:hover{background:rgba(39,174,96,0.2)}
.dr-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)}
.dr-rf{margin-top:6px;padding:7px 10px;border-radius:var(--r1);background:rgba(192,57,43,0.07);border-left:2px solid var(--son);font-size:0.67rem;color:#d9a0a0;line-height:1.55}

/* ════════════════════════════════════════════════════
   MISC
════════════════════════════════════════════════════ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.empty-txt{font-size:0.76rem;color:var(--t3);text-align:center;line-height:1.6}
</style>
